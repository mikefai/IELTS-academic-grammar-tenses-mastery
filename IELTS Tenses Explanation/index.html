<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Tenses Master Handbook: Comprehensive B2 Guide & 390+ Academic Examples</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="In-depth B2-level IELTS grammar lessons covering all English tenses, formulas, examiner insights, common candidate traps, and 10+ IELTS Academic examples per usage.">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-section">
        <span class="ielts-badge">IELTS</span>
        <div class="brand-text">
          <h1>Tenses Master Handbook</h1>
          <span>B2 Academic Grammar • Formulas • Examiner Insights • 390+ Examples</span>
        </div>
      </div>

      <div class="header-controls">
        <div class="search-input-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search tenses, rules, sentences..." aria-label="Search tenses and examples">
        </div>

        <a href="../IELTS%20Tenses%20Test/index.html" class="btn-primary" title="Launch the 100-question Mock Exam">
          <span>📝</span> Launch 100Q Mock Test
        </a>

        <button id="themeToggleBtn" class="btn-icon" title="Toggle Dark/Light Mode">🌙 Dark</button>
        <button id="printLessonBtn" class="btn-secondary" title="Print Current Lesson & Examples">🖨️ Print</button>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="main-wrapper">
    <!-- Left Column: Tense Navigation Sidebar -->
    <aside class="sidebar-panel">
      <nav id="tenseNavList" class="tense-nav-list" aria-label="Tense Selection Menu">
        <!-- Dynamically rendered via app.js -->
      </nav>
    </aside>

    <!-- Right Column: Interactive Lesson & Examples Area -->
    <div id="contentArea" class="content-area">
      <!-- Dynamically rendered via app.js -->
    </div>
  </main>

  <!-- Scripts -->
  <script src="tensesData.js"></script>
  <script src="app.js"></script>
</body>
</html>
